version: "3.9"

services:
  reading-app:
    build: .
    container_name: reading-pomodoro
    ports:
      - "8080:80"
    restart: unless-stopped

  reading-api:
    build:
      context: ./server
    container_name: reading-api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_PATH=/data/app.db
    restart: unless-stopped
    volumes:
      - db-data:/data

  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: shelffeed-dev
    working_dir: /workspace
    volumes:
      - .:/workspace
    ports:
      - "3001:3000" # APIデバッグ用
      - "8081:8080" # フロントデバッグ用
    command: /bin/bash
    tty: true

volumes:
  db-data:
